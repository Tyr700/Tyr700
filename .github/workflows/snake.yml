name: Gerar animação da cobrinha

on:
  schedule:
    # Roda a cada 12 horas. Você pode mudar se quiser.
    - cron: "0 */12 * * *"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # Adicionando a permissão para o GITHUB_TOKEN poder escrever no repositório
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - uses: Platypus-Code/action-autodelete-old-branch@v1
        with:
          branch: output
          days: 3650
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - uses: Platane/snk/svg-only@v3
        id: snake-svg
        with:
          github_user_name: Tyr700 # Seu nome de usuário
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
          
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output # O branch onde a imagem será salva
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
